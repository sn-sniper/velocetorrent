<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VELOCETORRENT // MV3 EXTENSION</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 12px;
        background: #09090b;
        color: #fafafa;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #27272a;
        padding-bottom: 8px;
        margin-bottom: 10px;
      }
      .accent {
        color: #10b981;
        font-weight: 700;
      }
      label {
        display: block;
        color: #71717a;
        font-size: 10px;
        margin-bottom: 4px;
        text-transform: uppercase;
      }
      input, select {
        width: 100%;
        box-sizing: border-box;
        background: #18181b;
        border: 1px solid #27272a;
        color: #fafafa;
        padding: 6px 8px;
        font-family: inherit;
        font-size: 11px;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid #10b981;
        color: #34d399;
        padding: 7px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        cursor: pointer;
      }
      button:hover {
        background: rgba(16, 185, 129, 0.25);
      }
      #status {
        margin-top: 8px;
        font-size: 10px;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="accent">VELOCETORRENT // IPC</span>
      <span id="telemetry">CONNECTING...</span>
    </div>

    <label>MAGNET:? URI OR .TORRENT URL</label>
    <input id="source" type="text" placeholder="magnet:?xt=urn:btih:..." />

    <label>OUTPUT DIRECTORY</label>
    <select id="dirSelect"></select>
    <input id="customDir" type="text" placeholder="/path/to/output" />

    <label>BEARER TOKEN (~/.config/velocetorrent/token)</label>
    <input id="token" type="password" placeholder="Optional local bearer token" />

    <button id="sendBtn">QUEUE TRANSFER</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
